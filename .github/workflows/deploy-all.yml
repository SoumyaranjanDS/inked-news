name: Deploy All to EC2

on:
  push:
    branches:
      - main
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Force sync with origin/main (discards local server build artifact changes)
            cd /var/www/inked-website
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Deploy Website
            cd inked-website
            npm ci || npm install
            # Write production environment variables before building
            cat > .env << 'EOF'
VITE_MAIN_BACKEND_URL=https://inkedfact.online
VITE_SCRAPER_URL=https://inkedfact.online
VITE_OPTIMIZER_URL=https://inkedfact.online
EOF
            npm run build
            cd ..
            
            # 3. Deploy Main Backend
            cd main_backend
            npm install
            pm2 restart main_backend
            cd ..
            
            # 4. Deploy Scraper
            cd scraper_backend
            # Optional: source venv/bin/activate if using virtual environment
            pip3 install -r requirements.txt
            pm2 restart scraper_backend
            cd ..
            
            # 5. Deploy Optimizer
            cd optimizer_engine
            # Optional: source venv/bin/activate if using virtual environment
            pip3 install -r requirements.txt
            pm2 restart optimizer_engine
