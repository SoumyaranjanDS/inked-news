name: Deploy Website to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'inked-website/**'
      - '.github/workflows/deploy-website.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'inked-website/package-lock.json'

      - name: Install Dependencies
        working-directory: ./inked-website
        run: npm ci

      - name: Build React App
        working-directory: ./inked-website
        run: npm run build
        env:
          VITE_MAIN_BACKEND_URL: ${{ secrets.VITE_MAIN_BACKEND_URL }}
          VITE_SCRAPER_URL: ${{ secrets.VITE_SCRAPER_URL }}
          VITE_OPTIMIZER_URL: ${{ secrets.VITE_OPTIMIZER_URL }}

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "inked-website/dist/*"
          target: "/var/www/inked-website/dist"
          strip_components: 2
